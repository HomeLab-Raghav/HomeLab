<!-- HomeLab Corp — Custom Wazuh Detection Rules -->
<!-- Deploy to: /var/ossec/etc/rules/local_rules.xml on WEB01 (Wazuh Manager) -->
<!-- After changes: sudo systemctl restart wazuh-manager -->
<!-- Verify: sudo /var/ossec/bin/wazuh-logtest -->

<group name="homelab_custom,">

  <!-- ── Privilege & Identity ──────────────────────────────────────────────── -->

  <!-- 100001: DC01 successful logon outside business hours -->
  <rule id="100001" level="12">
    <if_sid>60106</if_sid>
    <time>18:00 - 08:00</time>
    <description>DC01: Successful logon outside business hours</description>
    <mitre>
      <id>T1078</id>
    </mitre>
  </rule>

  <!-- 100003: New AD user account created (Event ID 4720) -->
  <rule id="100003" level="10">
    <if_sid>60204</if_sid>
    <description>AD: New user account created - verify with AD team</description>
    <mitre>
      <id>T1136.002</id>
    </mitre>
  </rule>

  <!-- 100004: User added to Domain Admins (Event ID 4728) - CRITICAL -->
  <rule id="100004" level="15">
    <if_sid>60274</if_sid>
    <field name="win.eventdata.targetUserName">Domain Admins</field>
    <description>CRITICAL: User added to Domain Admins group</description>
    <mitre>
      <id>T1098</id>
    </mitre>
  </rule>

  <!-- 100012: sudo executed on WEB01 (privilege tracking) -->
  <rule id="100012" level="8">
    <if_sid>5402</if_sid>
    <description>Linux: sudo command executed on WEB01 - review if unexpected</description>
    <mitre>
      <id>T1548.003</id>
    </mitre>
  </rule>

  <!-- ── Brute Force / Credential Attack ──────────────────────────────────── -->

  <!-- 100002: SSH brute force flood (10 failures in 60 seconds from same IP) -->
  <rule id="100002" level="14" frequency="10" timeframe="60">
    <if_matched_sid>5710</if_matched_sid>
    <same_source_ip />
    <description>SSH: 10+ failed logins from same IP within 60 seconds</description>
    <mitre>
      <id>T1110.001</id>
    </mitre>
  </rule>

  <!-- 100010: SSH login from outside HomeLab network -->
  <rule id="100010" level="10">
    <if_sid>5760</if_sid>
    <srcip>!192.168.56.0/24</srcip>
    <description>SSH: Successful login from outside HomeLab Corp network</description>
    <mitre>
      <id>T1078</id>
    </mitre>
  </rule>

  <!-- 100015: Brute force against DC01 outside business hours - CRITICAL -->
  <rule id="100015" level="15" frequency="5" timeframe="120">
    <if_matched_sid>60122</if_matched_sid>
    <time>18:00 - 08:00</time>
    <same_source_ip />
    <description>CRITICAL: Brute force against DC01 outside business hours</description>
    <mitre>
      <id>T1110.001</id>
    </mitre>
  </rule>

  <!-- ── Kerberos / Active Directory Attack ───────────────────────────────── -->

  <!-- 100005: Kerberoasting - multiple service ticket requests (Event ID 4769) -->
  <rule id="100005" level="12" frequency="5" timeframe="30">
    <if_matched_sid>60127</if_matched_sid>
    <description>AD: Multiple service ticket requests - possible Kerberoasting</description>
    <mitre>
      <id>T1558.003</id>
    </mitre>
  </rule>

  <!-- ── File Integrity (Web Server) ──────────────────────────────────────── -->

  <!-- 100006: Script file created in web root (webshell) -->
  <rule id="100006" level="14">
    <if_sid>550</if_sid>
    <field name="file">/var/www/html</field>
    <match>\.php$|\.asp$|\.aspx$|\.jsp$|\.py$|\.rb$</match>
    <description>FIM: Script file created in web root - possible webshell</description>
    <mitre>
      <id>T1505.003</id>
    </mitre>
  </rule>

  <!-- ── Web Application Attacks ──────────────────────────────────────────── -->

  <!-- 100007: Apache directory traversal attempt -->
  <rule id="100007" level="10">
    <if_sid>31101</if_sid>
    <url>../</url>
    <description>Web: Directory traversal attempt in Apache request</description>
    <mitre>
      <id>T1083</id>
    </mitre>
  </rule>

  <!-- 100008: Web scanner - 20 404 errors from same IP in 60 seconds -->
  <rule id="100008" level="10" frequency="20" timeframe="60">
    <if_matched_sid>31101</if_matched_sid>
    <same_source_ip />
    <description>Web: 20+ 404 errors from same IP - possible web scanner</description>
    <mitre>
      <id>T1595.002</id>
    </mitre>
  </rule>

  <!-- 100013: Sensitive file access probe (.env, .git, config files) -->
  <rule id="100013" level="12">
    <if_sid>31101</if_sid>
    <url>\.env|\.git|\.htpasswd|wp-config\.php|config\.php|\.ssh</url>
    <description>Web: Sensitive file access attempt - credential exposure probe</description>
    <mitre>
      <id>T1552.001</id>
    </mitre>
  </rule>

  <!-- ── Network Scanning ──────────────────────────────────────────────────── -->

  <!-- 100009: Aggressive network scan detected -->
  <rule id="100009" level="10">
    <if_sid>40111</if_sid>
    <description>Network: Aggressive scan detected (Nmap -A or similar)</description>
    <mitre>
      <id>T1046</id>
    </mitre>
  </rule>

  <!-- ── Defense Evasion ───────────────────────────────────────────────────── -->

  <!-- 100014: Windows firewall rule added (Event ID 4946) -->
  <rule id="100014" level="12">
    <if_sid>60105</if_sid>
    <field name="win.system.eventID">4946</field>
    <description>Windows: Firewall rule added - possible defense evasion</description>
    <mitre>
      <id>T1562.004</id>
    </mitre>
  </rule>

  <!-- ── SIEM Health ────────────────────────────────────────────────────────── -->

  <!-- 100011: Wazuh agent disconnected (monitoring gap) -->
  <rule id="100011" level="12">
    <if_sid>502</if_sid>
    <description>SIEM: Wazuh agent disconnected - monitoring gap opened</description>
  </rule>

</group>
