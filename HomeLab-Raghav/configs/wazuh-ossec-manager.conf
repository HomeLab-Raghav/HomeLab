<!-- HomeLab Corp — Wazuh Manager ossec.conf additions -->
<!-- Merge these sections into /var/ossec/etc/ossec.conf on WEB01 -->
<!-- Full file: do not replace existing content — ADD these blocks -->

<ossec_config>

  <!-- ── Global Settings ──────────────────────────────────────────────────── -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <rotate_interval>1d</rotate_interval>
    <max_output_size>10M</max_output_size>
  </global>

  <!-- ── Alerts ────────────────────────────────────────────────────────────── -->
  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- ── Apache Web Log Monitoring ────────────────────────────────────────── -->
  <localfile>
    <location>/var/log/apache2/access.log</location>
    <log_format>apache</log_format>
  </localfile>

  <localfile>
    <location>/var/log/apache2/error.log</location>
    <log_format>apache</log_format>
  </localfile>

  <!-- ── File Integrity Monitoring (FIM) ──────────────────────────────────── -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- Web root — realtime for webshell detection -->
    <directories check_all="yes" realtime="yes" report_changes="yes">
      /var/www/html
    </directories>

    <!-- Apache config — detect tampering -->
    <directories check_all="yes" realtime="yes">
      /etc/apache2
    </directories>

    <!-- Wazuh rules — detect tampering with detection logic -->
    <directories check_all="yes" realtime="yes">
      /var/ossec/etc/rules
    </directories>

    <!-- Critical system binaries -->
    <directories check_all="yes">
      /usr/bin,/usr/sbin,/bin,/sbin
    </directories>

    <!-- Ignore log files (change constantly) -->
    <ignore>/var/ossec/logs</ignore>
    <ignore>/var/log</ignore>
    <ignore>/proc</ignore>
    <ignore>/sys</ignore>
  </syscheck>

  <!-- ── Rootcheck ─────────────────────────────────────────────────────────── -->
  <rootcheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <rootkit_files>/var/ossec/etc/shared/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>/var/ossec/etc/shared/rootkit_trojans.txt</rootkit_trojans>
    <system_audit>/var/ossec/etc/shared/system_audit_rcl.txt</system_audit>
  </rootcheck>

  <!-- ── Active Response ───────────────────────────────────────────────────── -->
  <!-- Block IPs triggering SSH brute force (Rule 100002 / 5720) -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100002,5720</rules_id>
    <timeout>3600</timeout>
  </active-response>

  <!-- ── Vulnerability Detection ──────────────────────────────────────────── -->
  <vulnerability-detection>
    <enabled>yes</enabled>
    <index-status>yes</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>

</ossec_config>
