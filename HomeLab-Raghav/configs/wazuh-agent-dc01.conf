<!-- HomeLab Corp — Wazuh Agent config for DC01 (Windows Server 2022) -->
<!-- Deploy to: C:\Program Files (x86)\ossec-agent\ossec.conf -->
<!-- After changes: Restart-Service WazuhSvc -->

<ossec_config>

  <!-- ── Manager Connection ────────────────────────────────────────────────── -->
  <client>
    <server>
      <address>192.168.56.101</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>windows, windows-server, windows-server-2022</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- ── Windows Event Channels ────────────────────────────────────────────── -->

  <!-- Security events: Logons (4624, 4625), Account management (4720, 4728), -->
  <!--                  Kerberos (4768, 4769, 4771), Firewall (4946, 4950)     -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>
      Event[
        System[(
          EventID=4624 or EventID=4625 or EventID=4720 or EventID=4728 or
          EventID=4729 or EventID=4732 or EventID=4740 or EventID=4756 or
          EventID=4768 or EventID=4769 or EventID=4771 or EventID=4946 or
          EventID=4950 or EventID=4964
        )]
      ]
    </query>
  </localfile>

  <!-- System events: Service install (7045), system errors -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(Level=1 or Level=2 or EventID=7045)]]</query>
  </localfile>

  <!-- Application events: Application errors -->
  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[Level=1 or Level=2]]</query>
  </localfile>

  <!-- Active Directory Domain Services -->
  <localfile>
    <location>Directory Service</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- DNS Server -->
  <localfile>
    <location>DNS Server</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Sysmon (install Sysmon first: https://docs.microsoft.com/sysinternals) -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- PowerShell Script Block Logging -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(EventID=4103 or EventID=4104)]]</query>
  </localfile>

  <!-- ── File Integrity Monitoring (FIM) ──────────────────────────────────── -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- AD-critical directories -->
    <directories check_all="yes" realtime="yes">%WINDIR%\SYSVOL</directories>
    <directories check_all="yes" realtime="yes">%WINDIR%\system32\GroupPolicy</directories>
    <directories check_all="yes">%WINDIR%\system32\drivers\etc</directories>

    <!-- Wazuh agent config -->
    <directories check_all="yes" realtime="yes">
      %PROGRAMFILES(X86)%\ossec-agent\ossec.conf
    </directories>

    <ignore>%WINDIR%\SoftwareDistribution</ignore>
    <ignore>%WINDIR%\WinSxS</ignore>
  </syscheck>

</ossec_config>
